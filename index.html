<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpendSnap">
<title>SpendSnap</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box} body{margin:0;padding:18px;max-width:680px;margin:auto}
h1{margin:8px 0 2px;font-size:30px}.sub{color:#777;margin:0 0 18px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
.total{font-size:36px;font-weight:800}.label{font-size:13px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,.button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#171717;color:white;text-align:center;display:block;width:100%;cursor:pointer}
.secondary{background:#ececef;color:#171717} input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:5px 0 12px;background:white}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.muted{color:#777;font-size:13px}.amt{font-weight:700}
dialog{border:0;border-radius:20px;width:min(92%,520px);padding:20px}dialog::backdrop{background:#0008}
#receipt{display:none}.catbar{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin-top:5px}.catbar i{display:block;height:100%;background:#222}
small{color:#777}.danger{color:#b00020;background:none;padding:5px;width:auto;font-size:13px}.status{padding:10px;border-radius:12px;background:#f1f1f3;margin-bottom:12px;display:none}.preview{max-height:150px;max-width:100%;border-radius:12px;margin:0 0 12px}
</style></head>
<body>
<h1>SpendSnap</h1><p class="sub">Receipt. Categorize. Done. · V9</p>
<div class="card"><div class="label">Spending</div><div style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:8px 0"><button class="secondary" style="padding:9px" onclick="changeMonth(-1)">‹</button><div id="monthName" style="text-align:center;font-weight:800;font-size:18px"></div><button class="secondary" style="padding:9px" onclick="changeMonth(1)">›</button></div><div class="total" id="monthTotal">$0.00</div><div class="muted">Total spent in selected month</div></div>
<div class="grid">
<label class="button">📸 Scan Receipt<input id="receipt" type="file" accept="image/*" capture="environment"></label>
<button onclick="openForm()">✏️ Enter Expense</button>
</div>
<div class="card"><b>By category</b><div id="cats" style="margin-top:10px"></div></div>
<div class="card"><b>Recent expenses</b><div id="txns" style="margin-top:8px"></div></div>

<dialog id="form">
<form method="dialog" onsubmit="saveExpense(event)">
<h2 style="margin-top:0" id="formTitle">Add expense</h2>
<div id="ocrStatus" class="status"></div>
<img id="receiptPreview" class="preview" style="display:none">
<label>Amount</label><input id="amount" inputmode="decimal" type="number" min="0" step=".01" required placeholder="0.00">
<label>Category</label>
<select id="category" required>
<option>Groceries</option><option>Dining Out</option><option>Shopping</option><option>Home</option>
<option>Bills</option><option>Gas / Car</option><option>Medical</option><option>Entertainment</option>
<option>Personal Care</option><option>Pets</option><option>Real Estate</option><option>Sipsters</option><option>Other</option>
</select>
<div style="margin-top:12px">
<label style="display:flex;align-items:center;gap:8px;font-weight:700">
<input id="splitToggle" type="checkbox" style="width:auto" onchange="toggleSplit()"> Split this receipt between categories
</label>
<div id="splitBox" style="display:none;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:12px">
<div class="muted" style="margin-bottom:8px">Enter only the portions that belong in different categories. The split amounts must equal the receipt total.</div>
<div id="splitRows"></div>
<button type="button" class="secondary" onclick="addSplitRow()">+ Add another category</button>
<div id="splitStatus" class="status"></div>
</div>
</div>
<label>Store / note <small>(optional)</small></label><input id="merchant" placeholder="Costco, Target, etc.">
<label>Date</label><input id="date" type="date" required>
<input id="receiptData" type="hidden">
<div class="grid"><button type="button" class="secondary" onclick="form.close()">Cancel</button><button type="submit">Save</button></div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id), KEY='spendsnap_expenses';
let expenses=JSON.parse(localStorage.getItem(KEY)||'[]');
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n)}
function today(){return new Date().toISOString().slice(0,10)}
function openForm(receipt=''){
 $('formTitle').textContent=receipt?'Receipt expense':'Add expense';
 $('amount').value=''; $('merchant').value=''; $('date').value=today(); $('receiptData').value='';
 $('splitToggle').checked=false; $('splitBox').style.display='none'; $('splitRows').innerHTML=''; $('category').disabled=false;
 $('ocrStatus').style.display='none'; $('receiptPreview').style.display=receipt?'block':'none'; $('receiptPreview').src=receipt||'';
 $('form').showModal();
}
function parseReceipt(text){
 const raw=text||'';
 const lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean);

 // OCR often confuses O/0, I/1, S/5 and punctuation on receipt totals.
 function normalizeMoneyText(s){
   return s
     .replace(/[Oo](?=\d)/g,'0')
     .replace(/(?<=\d)[Oo]/g,'0')
     .replace(/[Il](?=\d)/g,'1')
     .replace(/(?<=\d)[Il]/g,'1')
     .replace(/(\d)\s*[,;:]\s*(\d{2})\b/g,'$1.$2');
 }
 function moneyValues(line){
   const s=normalizeMoneyText(line);
   const vals=[];
   for(const m of s.matchAll(/(?:\$?\s*)(\d{1,5})\s*[.]\s*(\d{2})\b/g)){
     const v=Number(m[1]+'.'+m[2]);
     if(Number.isFinite(v) && v>=0 && v<100000) vals.push(v);
   }
   return vals;
 }

 // Score amounts using receipt-language clues. This is more robust than
 // simply choosing the largest number on the receipt.
 const scored=[];
 lines.forEach((line,i)=>{
   const low=line.toLowerCase();
   const vals=moneyValues(line);
   vals.forEach(v=>{
     let score=0;
     if(/\b(grand\s*total|amount\s*due|balance\s*due)\b/i.test(line)) score+=14;
     if(/\b(balance)\b/i.test(line)) score+=12;
     if(/\b(total)\b/i.test(line)) score+=10;
     if(/\b(purchase|debit)\b/i.test(line)) score+=7;
     if(/\b(subtotal)\b/i.test(line)) score-=8;
     if(/\b(tax|change|cashback|cash back|savings|points|fuel|tender)\b/i.test(line)) score-=10;
     // Totals tend to be in the middle/lower part of a receipt.
     score += Math.min(3, Math.floor(i/Math.max(1,lines.length/4)));
     scored.push({v,score,i,line});
   });
 });

 // Repeated identical amounts near TOTAL/BALANCE/PURCHASE are strong evidence.
 const counts={};
 scored.filter(x=>x.v>0).forEach(x=>{
   const k=x.v.toFixed(2); counts[k]=(counts[k]||0)+1;
 });
 scored.forEach(x=>{ if((counts[x.v.toFixed(2)]||0)>=2) x.score+=4; });

 const valid=scored.filter(x=>x.v>0).sort((a,b)=>b.score-a.score || b.i-a.i);
 const amount=valid.length && valid[0].score>0 ? valid[0].v : null;

 // Merchant recognition V7: score merchant clues anywhere on the receipt.
 const all=raw.toLowerCase().replace(/\s+/g,' ');
 const compact=all.replace(/[^a-z0-9]/g,'');
 const merchants=[
  ['Kroger',[/\bkroger\b/i,/kroger\.com/i,/kroger\s*plus/i,/plus\s*customer/i]],
  ['Marshalls',[/\bmarshalls\b/i,/marshallsfeedback/i,/marshalls\s+values\s+your\s+feedback/i]],
  ['TJ Maxx',[/\btj\s*maxx\b/i,/tjmaxx/i,/tjxstyle/i]],
  ['HomeGoods',[/\bhomegoods\b/i,/homegoods\.com/i]],
  ['Meijer',[/\bmeijer\b/i,/meijer\.com/i,/mperks/i]],
  ['Target',[/\btarget\b/i,/target\.com/i,/target\s*circle/i]],
  ['Costco',[/\bcostco\b/i,/costco\.com/i,/costco\s*wholesale/i]],
  ['Walmart',[/\bwalmart\b/i,/walmart\.com/i]],
  ['Home Depot',[/\bhome\s*depot\b/i,/homedepot\.com/i]],
  ["Lowe's",[/\blowe'?s\b/i,/lowes\.com/i]],
  ['CVS',[/\bcvs\b/i,/cvs\.com/i,/extracare/i]],
  ['Walgreens',[/\bwalgreens\b/i,/walgreens\.com/i,/mywalgreens/i]],
  ['Aldi',[/\baldi\b/i,/aldi\.us/i]],
  ['Whole Foods',[/\bwhole\s*foods\b/i,/wholefoodsmarket/i]],
  ["Trader Joe's",[/\btrader\s*joe'?s\b/i]],
  ["Sam's Club",[/\bsam'?s\s*club\b/i,/samsclub\.com/i]],
  ['Menards',[/\bmenards\b/i,/menards\.com/i]]
 ];
 let merchant='',best=0;
 for(const [name,clues] of merchants){
   let score=0;
   for(const clue of clues) if(clue.test(all)) score+=4;
   const key=name.toLowerCase().replace(/[^a-z0-9]/g,'');
   if(key.length>=4 && compact.includes(key)) score+=3;
   if(score>best){best=score;merchant=name;}
 }
 // Generic fallback: favor plausible business-name text near the top.
 if(!merchant){
   const bad=/\b(receipt|store|tel|phone|www|http|date|time|customer|cashier|register|terminal|transaction|address|road|rd\.|mile|subtotal|total|balance|purchase|debit|credit|visa|mastercard|sale|return|item|tax)\b/i;
   let picks=[];
   lines.slice(0,15).forEach((l,i)=>{
     const c=l.replace(/[^\w &'#.-]/g,' ').replace(/\s+/g,' ').trim();
     if(/[A-Za-z]{3}/.test(c)&&c.length>=3&&c.length<=45&&!bad.test(c)&&!/^\s*\d/.test(c)){
       let score=15-i;
       if(/^[A-Za-z][A-Za-z &'#.-]+$/.test(c)) score+=3;
       picks.push({c,score});
     }
   });
   picks.sort((x,y)=>y.score-x.score);
   if(picks.length) merchant=picks[0].c;
 }
 // Common US receipt dates.
 let receiptDate=null;
 for(const l of lines){
   const re=/\b(0?[1-9]|1[0-2])[\/\-.](0?[1-9]|[12]\d|3[01])[\/\-.]((?:19|20)?\d{2})\b/g;
   for(const m of l.matchAll(re)){
     let y=+m[3]; if(y<100)y+=y>=70?1900:2000;
     const mo=+m[1],d=+m[2],dt=new Date(y,mo-1,d);
     if(dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d){
       receiptDate=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
       break;
     }
   }
   if(receiptDate) break;
 }
 return {amount,merchant,date:receiptDate};
}
async function scanReceipt(data){
 const s=$('ocrStatus'); s.style.display='block'; s.textContent='Reading receipt…';
 try{
   if(!window.Tesseract) throw new Error('OCR unavailable');
   const result=await Tesseract.recognize(data,'eng',{logger:m=>{
     if(m.status==='recognizing text') s.textContent='Reading receipt… '+Math.round((m.progress||0)*100)+'%';
   }});
   const found=parseReceipt(result.data.text||'');
   if(found.amount) $('amount').value=found.amount.toFixed(2);
   if(found.merchant) $('merchant').value=found.merchant;
   if(found.date) $('date').value=found.date;
   const bits=[]; if(found.amount)bits.push(money(found.amount)); if(found.date)bits.push(new Date(found.date+'T12:00:00').toLocaleDateString('en-US'));
   s.textContent=bits.length?'I found '+bits.join(' and ')+'. Check them, choose a category, and save.':'I couldn’t confidently read the total/date. Enter or correct them, choose a category, and save.';
 }catch(err){
   s.textContent='Receipt reading didn’t cooperate. Enter the amount manually, pick a category, and save.';
 }
}
$('receipt').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=()=>{openForm(r.result);scanReceipt(r.result)}; r.readAsDataURL(f); e.target.value='';
});

const SPLIT_OPTIONS=`<option>Groceries</option><option>Dining Out</option><option>Shopping</option><option>Home</option><option>Bills</option><option>Gas / Car</option><option>Medical</option><option>Entertainment</option><option>Personal Care</option><option>Pets</option><option>Real Estate</option><option>Sipsters</option><option>Other</option>`;
function addSplitRow(category='',amount=''){
 const row=document.createElement('div');
 row.className='splitRow';
 row.style.cssText='display:grid;grid-template-columns:1fr 110px 34px;gap:7px;margin-bottom:8px;align-items:center';
 row.innerHTML=`<select class="splitCat">${SPLIT_OPTIONS}</select><input class="splitAmt" type="number" min="0" step=".01" inputmode="decimal" placeholder="$0.00"><button type="button" class="danger" style="padding:8px" onclick="this.parentElement.remove();updateSplitStatus()">×</button>`;
 row.querySelector('.splitCat').value=category||$('category').value;
 row.querySelector('.splitAmt').value=amount;
 row.querySelector('.splitAmt').addEventListener('input',updateSplitStatus);
 $('splitRows').appendChild(row); updateSplitStatus();
}
function toggleSplit(){
 const on=$('splitToggle').checked;
 $('splitBox').style.display=on?'block':'none';
 $('category').disabled=on;
 if(on&&!document.querySelector('.splitRow')){addSplitRow($('category').value,'');addSplitRow('Other','');}
 updateSplitStatus();
}
function updateSplitStatus(){
 if(!$('splitToggle').checked)return;
 const total=+$('amount').value||0;
 const used=[...document.querySelectorAll('.splitAmt')].reduce((s,x)=>s+(+x.value||0),0);
 const diff=Math.round((total-used)*100)/100;
 $('splitStatus').textContent=Math.abs(diff)<.005?'✓ Split matches receipt total':(diff>0?money(diff)+' still needs a category':money(-diff)+' over the receipt total');
}
$('amount').addEventListener('input',updateSplitStatus);
function saveExpense(e){
 e.preventDefault();
 const total=+$('amount').value, merchant=$('merchant').value.trim(), date=$('date').value, base=Date.now();
 let newItems=[];
 if($('splitToggle').checked){
   const rows=[...document.querySelectorAll('.splitRow')];
   const splitTotal=rows.reduce((s,r)=>s+(+r.querySelector('.splitAmt').value||0),0);
   if(!rows.length||Math.abs(splitTotal-total)>.005){alert('Your split amounts need to equal the receipt total before saving.');return;}
   newItems=rows.filter(r=>(+r.querySelector('.splitAmt').value||0)>0).map((r,i)=>({
     id:base+i,amount:+r.querySelector('.splitAmt').value,category:r.querySelector('.splitCat').value,
     merchant,date,receipt:'',receiptTotal:total,split:true
   }));
 }else{
   newItems=[{id:base,amount:total,category:$('category').value,merchant,date,receipt:'',receiptTotal:total,split:false}];
 }
 expenses.unshift(...newItems);
 localStorage.setItem(KEY,JSON.stringify(expenses));
 const parts=date.split('-').map(Number);if(parts.length===3)viewDate=new Date(parts[0],parts[1]-1,1);
 $('splitToggle').checked=false;$('splitBox').style.display='none';$('splitRows').innerHTML='';$('category').disabled=false;
 $('form').close(); render();
}
function del(id){if(confirm('Delete this expense?')){expenses=expenses.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(expenses));render()}}
let viewDate=new Date();
function changeMonth(delta){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+delta,1);render()}
function render(){
 const ym=`${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}`,m=expenses.filter(x=>x.date.startsWith(ym));
 const monthLabel=viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
 $('monthName').textContent=monthLabel || `${viewDate.getMonth()+1}/${viewDate.getFullYear()}`;
 $('monthTotal').textContent=money(m.reduce((s,x)=>s+x.amount,0));
 const sums={};m.forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);const max=Math.max(1,...Object.values(sums));
 $('cats').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin:10px 0"><div class="row" style="padding:0;border:0"><span>${c}</span><b>${money(v)}</b></div><div class="catbar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<div class="muted">No spending recorded for this month.</div>';
 const recent=m.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,30);
 $('txns').innerHTML=recent.map(x=>`<div class="row"><div><b>${x.merchant||x.category}</b><div class="muted">${x.date} · ${x.category}</div></div><div style="text-align:right"><div class="amt">${money(x.amount)}</div><button class="danger" onclick="del(${x.id})">delete</button></div></div>`).join('')||'<div class="muted">No expenses in this month.</div>';
}

function downloadFile(name,content,type){
 const blob=new Blob([content],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v){
 const s=String(v??'');
 return '"'+s.replace(/"/g,'""')+'"';
}
function exportExcel(){
 const rows=[['Date','Store','Category','Amount','Split Receipt','Original Receipt Total']];
 expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
   rows.push([x.date,x.merchant||'',x.category||'',Number(x.amount).toFixed(2),x.split?'Yes':'No',Number(x.receiptTotal??x.amount).toFixed(2)]);
 });
 const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
 downloadFile('SpendSnap_Expenses.csv',csv,'text/csv;charset=utf-8');
}
function exportBackup(){
 const data={app:'SpendSnap',version:7,exportedAt:new Date().toISOString(),expenses};
 downloadFile('SpendSnap_Backup.json',JSON.stringify(data,null,2),'application/json');
}
function restoreBackup(ev){
 const file=ev.target.files&&ev.target.files[0]; if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const data=JSON.parse(r.result);
     if(!data||!Array.isArray(data.expenses))throw new Error('Invalid backup');
     if(!confirm(`Restore ${data.expenses.length} expenses? This will replace the data currently in SpendSnap.`))return;
     expenses=data.expenses;
     localStorage.setItem('spendsnap_expenses',JSON.stringify(expenses));
     render();
     alert('SpendSnap backup restored.');
   }catch(e){alert('That file is not a valid SpendSnap backup.');}
   ev.target.value='';
 };
 r.readAsText(file);
}

render();
</script></body></html>

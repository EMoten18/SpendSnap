<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpendSnap">
<title>SpendSnap</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box} body{margin:0;padding:18px;max-width:680px;margin:auto}
h1{margin:8px 0 2px;font-size:30px}.sub{color:#777;margin:0 0 18px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
.total{font-size:36px;font-weight:800}.label{font-size:13px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,.button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#171717;color:white;text-align:center;display:block;width:100%;cursor:pointer}
.secondary{background:#ececef;color:#171717} input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:5px 0 12px;background:white}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.muted{color:#777;font-size:13px}.amt{font-weight:700}
dialog{border:0;border-radius:20px;width:min(92%,520px);padding:20px}dialog::backdrop{background:#0008}
#receipt{display:none}.catbar{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin-top:5px}.catbar i{display:block;height:100%;background:#222}
small{color:#777}.danger{color:#b00020;background:none;padding:5px;width:auto;font-size:13px}.status{padding:10px;border-radius:12px;background:#f1f1f3;margin-bottom:12px;display:none}.preview{max-height:150px;max-width:100%;border-radius:12px;margin:0 0 12px}
</style></head>
<body>
<h1>SpendSnap</h1><p class="sub">Receipt. Categorize. Done. · V4</p>
<div class="card"><div class="label">Spending</div><div style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:8px 0"><button class="secondary" style="padding:9px" onclick="changeMonth(-1)">‹</button><div id="monthName" style="text-align:center;font-weight:800;font-size:18px"></div><button class="secondary" style="padding:9px" onclick="changeMonth(1)">›</button></div><div class="total" id="monthTotal">$0.00</div><div class="muted">Total spent in selected month</div></div>
<div class="grid">
<label class="button">📸 Scan Receipt<input id="receipt" type="file" accept="image/*" capture="environment"></label>
<button onclick="openForm()">✏️ Enter Expense</button>
</div>
<div class="card"><b>By category</b><div id="cats" style="margin-top:10px"></div></div>
<div class="card"><b>Recent expenses</b><div id="txns" style="margin-top:8px"></div></div>

<dialog id="form">
<form method="dialog" onsubmit="saveExpense(event)">
<h2 style="margin-top:0" id="formTitle">Add expense</h2>
<div id="ocrStatus" class="status"></div>
<img id="receiptPreview" class="preview" style="display:none">
<label>Amount</label><input id="amount" inputmode="decimal" type="number" min="0" step=".01" required placeholder="0.00">
<label>Category</label>
<select id="category" required>
<option>Groceries</option><option>Dining Out</option><option>Shopping</option><option>Home</option>
<option>Bills</option><option>Gas / Car</option><option>Medical</option><option>Entertainment</option>
<option>Personal Care</option><option>Pets</option><option>Real Estate</option><option>Sipsters</option><option>Other</option>
</select>
<label>Store / note <small>(optional)</small></label><input id="merchant" placeholder="Costco, Target, etc.">
<label>Date</label><input id="date" type="date" required>
<input id="receiptData" type="hidden">
<div class="grid"><button type="button" class="secondary" onclick="form.close()">Cancel</button><button type="submit">Save</button></div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id), KEY='spendsnap_expenses';
let expenses=JSON.parse(localStorage.getItem(KEY)||'[]');
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n)}
function today(){return new Date().toISOString().slice(0,10)}
function openForm(receipt=''){
 $('formTitle').textContent=receipt?'Receipt expense':'Add expense';
 $('amount').value=''; $('merchant').value=''; $('date').value=today(); $('receiptData').value=receipt;
 $('ocrStatus').style.display='none'; $('receiptPreview').style.display=receipt?'block':'none'; $('receiptPreview').src=receipt||'';
 $('form').showModal();
}
function parseReceipt(text){
 const raw=text||'';
 const lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean);

 // OCR often confuses O/0, I/1, S/5 and punctuation on receipt totals.
 function normalizeMoneyText(s){
   return s
     .replace(/[Oo](?=\d)/g,'0')
     .replace(/(?<=\d)[Oo]/g,'0')
     .replace(/[Il](?=\d)/g,'1')
     .replace(/(?<=\d)[Il]/g,'1')
     .replace(/(\d)\s*[,;:]\s*(\d{2})\b/g,'$1.$2');
 }
 function moneyValues(line){
   const s=normalizeMoneyText(line);
   const vals=[];
   for(const m of s.matchAll(/(?:\$?\s*)(\d{1,5})\s*[.]\s*(\d{2})\b/g)){
     const v=Number(m[1]+'.'+m[2]);
     if(Number.isFinite(v) && v>=0 && v<100000) vals.push(v);
   }
   return vals;
 }

 // Score amounts using receipt-language clues. This is more robust than
 // simply choosing the largest number on the receipt.
 const scored=[];
 lines.forEach((line,i)=>{
   const low=line.toLowerCase();
   const vals=moneyValues(line);
   vals.forEach(v=>{
     let score=0;
     if(/\b(grand\s*total|amount\s*due|balance\s*due)\b/i.test(line)) score+=14;
     if(/\b(balance)\b/i.test(line)) score+=12;
     if(/\b(total)\b/i.test(line)) score+=10;
     if(/\b(purchase|debit)\b/i.test(line)) score+=7;
     if(/\b(subtotal)\b/i.test(line)) score-=8;
     if(/\b(tax|change|cashback|cash back|savings|points|fuel|tender)\b/i.test(line)) score-=10;
     // Totals tend to be in the middle/lower part of a receipt.
     score += Math.min(3, Math.floor(i/Math.max(1,lines.length/4)));
     scored.push({v,score,i,line});
   });
 });

 // Repeated identical amounts near TOTAL/BALANCE/PURCHASE are strong evidence.
 const counts={};
 scored.filter(x=>x.v>0).forEach(x=>{
   const k=x.v.toFixed(2); counts[k]=(counts[k]||0)+1;
 });
 scored.forEach(x=>{ if((counts[x.v.toFixed(2)]||0)>=2) x.score+=4; });

 const valid=scored.filter(x=>x.v>0).sort((a,b)=>b.score-a.score || b.i-a.i);
 const amount=valid.length && valid[0].score>0 ? valid[0].v : null;

 // Merchant recognition. First use strong known-brand/domain clues, then
 // fall back to a cleaned early receipt line.
 const all=raw.toLowerCase();
 const brands=[
   ['Kroger',/\bkroger\b|kroger\.com/i],
   ['Meijer',/\bmeijer\b|meijer\.com/i],
   ['Target',/\btarget\b|target\.com/i],
   ['Costco',/\bcostco\b|costco\.com/i],
   ['Walmart',/\bwalmart\b|walmart\.com/i],
   ['Home Depot',/\bhome\s*depot\b|homedepot\.com/i],
   ["Lowe's",/\blowe'?s\b|lowes\.com/i],
   ['CVS',/\bcvs\b|cvs\.com/i],
   ['Walgreens',/\bwalgreens\b|walgreens\.com/i],
   ['Aldi',/\baldi\b|aldi\.us/i],
   ['Whole Foods',/\bwhole\s*foods\b/i],
   ['Trader Joe’s',/\btrader\s*joe'?s\b/i]
 ];
 let merchant='';
 for(const [name,re] of brands){ if(re.test(all)){merchant=name;break;} }

 // Kroger logo OCR can be mangled, but other Kroger-specific receipt text is useful.
 if(!merchant && (/kroger\s*plus\s*customer/i.test(all) || /www\.\s*kroger/i.test(all))) merchant='Kroger';

 if(!merchant){
   for(const l of lines.slice(0,10)){
     if(/[A-Za-z]{3}/.test(l) &&
        !/\b(receipt|store|tel|phone|www|http|date|time|customer|address|road|rd\.|mile)\b/i.test(l) &&
        !/^\s*\d/.test(l)){
       merchant=l.replace(/[^\w &'#.-]/g,' ').replace(/\s+/g,' ').trim().slice(0,50);
       if(merchant) break;
     }
   }
 }

 // Common US receipt dates.
 let receiptDate=null;
 for(const l of lines){
   const re=/\b(0?[1-9]|1[0-2])[\/\-.](0?[1-9]|[12]\d|3[01])[\/\-.]((?:19|20)?\d{2})\b/g;
   for(const m of l.matchAll(re)){
     let y=+m[3]; if(y<100)y+=y>=70?1900:2000;
     const mo=+m[1],d=+m[2],dt=new Date(y,mo-1,d);
     if(dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d){
       receiptDate=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
       break;
     }
   }
   if(receiptDate) break;
 }
 return {amount,merchant,date:receiptDate};
}
async function scanReceipt(data){
 const s=$('ocrStatus'); s.style.display='block'; s.textContent='Reading receipt…';
 try{
   if(!window.Tesseract) throw new Error('OCR unavailable');
   const result=await Tesseract.recognize(data,'eng',{logger:m=>{
     if(m.status==='recognizing text') s.textContent='Reading receipt… '+Math.round((m.progress||0)*100)+'%';
   }});
   const found=parseReceipt(result.data.text||'');
   if(found.amount) $('amount').value=found.amount.toFixed(2);
   if(found.merchant) $('merchant').value=found.merchant;
   if(found.date) $('date').value=found.date;
   const bits=[]; if(found.amount)bits.push(money(found.amount)); if(found.date)bits.push(new Date(found.date+'T12:00:00').toLocaleDateString('en-US'));
   s.textContent=bits.length?'I found '+bits.join(' and ')+'. Check them, choose a category, and save.':'I couldn’t confidently read the total/date. Enter or correct them, choose a category, and save.';
 }catch(err){
   s.textContent='Receipt reading didn’t cooperate. Enter the amount manually, pick a category, and save.';
 }
}
$('receipt').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=()=>{openForm(r.result);scanReceipt(r.result)}; r.readAsDataURL(f); e.target.value='';
});
function saveExpense(e){
 e.preventDefault();
 expenses.unshift({id:Date.now(),amount:+$('amount').value,category:$('category').value,merchant:$('merchant').value.trim(),date:$('date').value,receipt:$('receiptData').value});
 try{localStorage.setItem(KEY,JSON.stringify(expenses))}catch(err){
   // If receipt images make storage too large, retain the expense without the image.
   expenses[0].receipt=''; localStorage.setItem(KEY,JSON.stringify(expenses)); alert('Expense saved, but the receipt photo was too large to keep on this device.');
 }
 $('form').close(); render();
}
function del(id){if(confirm('Delete this expense?')){expenses=expenses.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(expenses));render()}}
let viewDate=new Date();
function changeMonth(delta){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+delta,1);render()}
function render(){
 const ym=`${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}`,m=expenses.filter(x=>x.date.startsWith(ym));
 $('monthName').textContent=viewDate.toLocaleString('en-US',{month:'long',year:'numeric'});
 $('monthTotal').textContent=money(m.reduce((s,x)=>s+x.amount,0));
 const sums={};m.forEach(x=>sums[x.category]=(sums[x.category]||0)+x.amount);const max=Math.max(1,...Object.values(sums));
 $('cats').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin:10px 0"><div class="row" style="padding:0;border:0"><span>${c}</span><b>${money(v)}</b></div><div class="catbar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<div class="muted">No spending recorded for this month.</div>';
 const recent=m.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,30);
 $('txns').innerHTML=recent.map(x=>`<div class="row"><div><b>${x.merchant||x.category}</b><div class="muted">${x.date} · ${x.category}${x.receipt?' · 📎 receipt':''}</div></div><div style="text-align:right"><div class="amt">${money(x.amount)}</div><button class="danger" onclick="del(${x.id})">delete</button></div></div>`).join('')||'<div class="muted">No expenses in this month.</div>';
}
render();
</script></body></html>
